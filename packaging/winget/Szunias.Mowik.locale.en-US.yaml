ShortDescription: Private, local push-to-talk dictation for Windows.
Description: >-
  Mówik turns speech into text entirely on your own computer. Hold a key,
  talk, release, and the text is pasted into the active window. Speech
  recognition runs locally with faster-whisper, so recordings never leave
  the machine, and the app works offline once the selected model has been
  downloaded. Polish and English interfaces, a custom dictionary, voice
  commands, and optional GPU acceleration are included.
Moniker: mowik

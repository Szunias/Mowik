ShortDescription: Prywatne dyktowanie działające lokalnie na Windowsie.
Description: >-
  Mówik zamienia mowę na tekst wyłącznie na twoim komputerze. Przytrzymaj
  klawisz, powiedz zdanie, puść klawisz, a tekst trafi do aktywnego okna.
  Rozpoznawanie działa lokalnie na silniku faster-whisper, więc nagrania
  nie opuszczają komputera, a po pobraniu modelu aplikacja działa bez
  internetu. W zestawie polski i angielski interfejs, własny słownik,
  komendy głosowe oraz opcjonalne przyspieszenie na karcie graficznej.
